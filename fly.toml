# fly.toml app configuration file
# Generated for ai-caller-enterprise

app = "ai-caller-enterprise"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  ENV = "production"
  LOG_LEVEL = "INFO"

# Use the [[services]] syntax (not [http_service]) because the
# community-confirmed working config for WebSocket on Fly uses
# explicit port handlers. [http_service] does NOT support WebSocket
# upgrades — it always returns 502 with "protocol error" on upgrade.

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

  [[services.http_checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
